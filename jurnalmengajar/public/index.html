<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jurnal Mengajar, aplikasi pencatatan jurnal dan jadwal mengajar untuk guru dan admin sekolah.">
    <meta name="theme-color" content="#2563EB">
    <title>Jurnal Mengajar</title>
    <style>
      :root {
        --primary: #2563EB;
        --primary-dark: #1E40AF;
        --bg: #F8FAFC;
        --surface: #FFFFFF;
        --text: #0F172A;
        --muted: #64748B;
        --border: #E2E8F0;
      }
      * { box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 24px 16px;
      }
      .card {
        background: var(--surface);
        max-width: 440px;
        margin: 72px auto 16px;
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #EFF6FF;
        border: 1px solid #BFDBFE;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 16px;
      }
      h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.2px; }
      p { line-height: 1.6; margin: 0 0 20px; font-size: 14px; color: var(--muted); }
      a.button {
        display: block;
        text-align: center;
        background: var(--primary);
        color: #fff;
        padding: 13px 16px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
      }
      a.button:hover { background: var(--primary-dark); }
      .note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">J</div>
      <h1>Jurnal Mengajar</h1>
      <p>Aplikasi pencatatan jurnal dan jadwal mengajar untuk guru dan admin sekolah. Halaman web aplikasi dimuat dari hasil build Flutter.</p>
      <a class="button" href="/">Buka Aplikasi</a>
    </div>
    <p class="note">Deploy aktif menggunakan direktori build/web.</p>
  </body>
</html>
